baseURL = 'https://atreezilla.com/'
title = 'Блог atreezilla'
theme = 'bootstrap-multilingual'
publishDir = "docs"
# Multi-Language Routing Configuration
defaultContentLanguage = 'uk'
defaultContentLanguageInSubdir = false
uglyURLs = true

[pagination]
  pagerSize = 6
  
  
[languages]
  [languages.uk]
    languageCode = 'uk-UA'
    languageName = 'Українська'
    weight = 1
    title = 'Портфоліо'
    [languages.uk.params]
      bio = 'Системи, архітектура та особистий простір.'
      author = 'elkrot'

  [languages.en]
    languageCode = 'en-US'
    languageName = 'English'
    weight = 2
    title = 'Portfolio'
    [languages.en.params]
      bio = 'Cloud architecture & creative life.'
      author = 'elkrot'

  [languages.ru]
    languageCode = 'ru'
    languageName = 'Русский'
    weight = 3
    title = 'Портфолио'
    [languages.ru.params]
      bio = 'Высоконагруженные системы и семейные хроники.'
      author = 'elkrot'

[params]
  bootstrapVersion = '5.3.3'
  enableReactIslands = true
  githubUrl = 'https://github.com/example'
  telegramUrl = 'https://t.me/example'
  email = 'elkrot@gmail.com'
  copyright = 'elkrot. All rights reserved.'
  postsPerPage = 6       # 
  blogPerPage = 4        # Для раздела /blog/
  portfolioPerPage = 3   # Для раздела /portfolio/

[menu]
  [[menu.main]]
    identifier = 'portfolio-tech'
    name = 'Tech Portfolio'
    url = '/portfolio/'
    weight = 10

  [[menu.main]]
    identifier = 'portfolio-life'
    name = 'Family & Hobbies'
    url = '/life/'
    weight = 20

  [[menu.main]]
    identifier = 'blog'
    name = 'Blog'
    url = '/blog/'
    weight = 15
	
  [[menu.main]]
    identifier = 'posts'
    name = 'Posts'
    url = '/posts/'
    weight = 15

  [[menu.main]]
    identifier = 'contacts'
    name = 'Contacts'
    url = '/contacts/'
    weight = 40
	
 [params.homeLimits]
    portfolio = 6   # Количество проектов в блоке "Портфоліо"
    posts = 3       # Количество записей в блоке "Публікації"
    life = 3        # Количество историй в блоке "Сім'я та хобі"
    blog = 3        # Количество статей в блоке "Блог"
    chronicle = 5   # Количество событий в блоке "Стрічка новин 
 # ==============================================================================
  # Параметри фільтрації для розділів (Portfolio, Posts, Life, Blog)
  # Можна редагувати прямо тут, додавати або прибирати категорії та теги!
  # ==============================================================================
  [params.filters]

    # 1. Розділ "Портфоліо" (/portfolio/)
    [params.filters.portfolio]
      categories = [
        { id = "frontend", name = "Frontend" },
        { id = "backend", name = "Backend" },
        { id = "python-ai", name = "Python & AI" },
        { id = "fullstack", name = "Fullstack" },
        { id = "cloud-devops", name = "Cloud & DevOps" },
        { id = "mobile", name = "Mobile" }
      ]
      stacks = ["React", "TypeScript", "Go", "Python", "Docker", "PostgreSQL", "FastAPI", "Kubernetes", "AWS", "GraphQL", "Next.js", "Tailwind"]

    # 2. Розділ "Публікації" (/posts/)
    [params.filters.posts]
      categories = [
        { id = "csharp", name = "C# & .NET" },
        { id = "architecture", name = "Архітектура" },
        { id = "devops", name = "DevOps" },
        { id = "backend", name = "Backend" },
        { id = "frontend", name = "Frontend" }
      ]
      tags = ["C#", ".NET", "Go", "Kubernetes", "Docker", "Python", "Linux", "TypeScript", "Architecture"]

    # 3. Розділ "Сім'я та життя" (/life/)
    [params.filters.life]
      categories = [
        { id = "family", name = "Сім'я" },
        { id = "wife", name = "Дружина" },
        { id = "kids", name = "Діти" },
        { id = "travel", name = "Подорожі" },
        { id = "hobbies", name = "Хоббі" }
      ]
      tags = ["Сім'я", "Діти", "Подорожі", "Спорт", "Фотографія"]

    # 4. Розділ "Блог" (/blog/)
    [params.filters.blog]
      categories = [
        { id = "hugo", name = "Hugo & SSG" },
        { id = "bootstrap", name = "Bootstrap" },
        { id = "react", name = "React" },
        { id = "performance", name = "Оптимізація" }
      ]
      tags = ["Hugo", "Bootstrap 5", "i18n", "React", "SSG", "CSS"]


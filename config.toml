baseURL = 'https://atreezilla.com/'
title = 'Блог atreezilla'
theme = 'bootstrap-multilingual'
paginate = 6
publishDir = "docs"
# Multi-Language Routing Configuration
defaultContentLanguage = 'uk'
defaultContentLanguageInSubdir = false

[languages]
  [languages.uk]
    languageCode = 'uk-UA'
    languageName = 'Українська'
    weight = 1
    title = 'Портфоліо'
    [languages.uk.params]
      bio = 'Системи, архітектура та особистий простір.'
      author = 'elkrot'

  [languages.en]
    languageCode = 'en-US'
    languageName = 'English'
    weight = 2
    title = 'Portfolio'
    [languages.en.params]
      bio = 'Cloud architecture & creative life.'
      author = 'elkrot'

  [languages.ru]
    languageCode = 'ru'
    languageName = 'Русский'
    weight = 3
    title = 'Портфолио'
    [languages.ru.params]
      bio = 'Высоконагруженные системы и семейные хроники.'
      author = 'elkrot'

[params]
  bootstrapVersion = '5.3.3'
  enableReactIslands = true
  githubUrl = 'https://github.com/example'
  telegramUrl = 'https://t.me/example'
  email = 'elkrot@gmail.com'
  copyright = 'elkrot. All rights reserved.'

[menu]
  [[menu.main]]
    identifier = 'portfolio-tech'
    name = 'Tech Portfolio'
    url = '/portfolio/'
    weight = 10

  [[menu.main]]
    identifier = 'portfolio-life'
    name = 'Family & Hobbies'
    url = '/life/'
    weight = 20

  [[menu.main]]
    identifier = 'blog'
    name = 'Blog'
    url = '/blog/'
    weight = 15
	
  [[menu.main]]
    identifier = 'posts'
    name = 'Posts'
    url = '/posts/'
    weight = 15

  [[menu.main]]
    identifier = 'contacts'
    name = 'Contacts'
    url = '/contacts/'
    weight = 40

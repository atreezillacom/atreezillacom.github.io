baseURL = 'https://atreezilla.com/'
title = 'Блог atreezilla'
theme = 'bootstrap-multilingual'
publishDir = "docs"
# Multi-Language Routing Configuration
defaultContentLanguage = 'uk'
defaultContentLanguageInSubdir = false
uglyURLs = true

[pagination]
  pagerSize = 6
  
  
[languages]
  [languages.uk]
    languageCode = 'uk-UA'
    languageName = 'Українська'
    weight = 1
    title = 'Портфоліо'
    [languages.uk.params]
      bio = 'Системи, архітектура та особистий простір.'
      author = 'elkrot'

  [languages.en]
    languageCode = 'en-US'
    languageName = 'English'
    weight = 2
    title = 'Portfolio'
    [languages.en.params]
      bio = 'Cloud architecture & creative life.'
      author = 'elkrot'

  [languages.ru]
    languageCode = 'ru'
    languageName = 'Русский'
    weight = 3
    title = 'Портфолио'
    [languages.ru.params]
      bio = 'Высоконагруженные системы и семейные хроники.'
      author = 'elkrot'

[params]
  bootstrapVersion = '5.3.3'
  enableReactIslands = true
  githubUrl = 'https://github.com/example'
  telegramUrl = 'https://t.me/example'
  email = 'elkrot@gmail.com'
  copyright = 'elkrot. All rights reserved.'
  postsPerPage = 6       # 
  blogPerPage = 4        # Для раздела /blog/
  portfolioPerPage = 3   # Для раздела /portfolio/

[menu]
  [[menu.main]]
    identifier = 'portfolio-tech'
    name = 'Tech Portfolio'
    url = '/portfolio/'
    weight = 10

  [[menu.main]]
    identifier = 'portfolio-life'
    name = 'Family & Hobbies'
    url = '/life/'
    weight = 20

  [[menu.main]]
    identifier = 'blog'
    name = 'Blog'
    url = '/blog/'
    weight = 15
	
  [[menu.main]]
    identifier = 'posts'
    name = 'Posts'
    url = '/posts/'
    weight = 15

  [[menu.main]]
    identifier = 'contacts'
    name = 'Contacts'
    url = '/contacts/'
    weight = 40
	
 [params.homeLimits]
    portfolio = 6   # Количество проектов в блоке "Портфоліо"
    posts = 3       # Количество записей в блоке "Публікації"
    life = 3        # Количество историй в блоке "Сім'я та хобі"
    blog = 3        # Количество статей в блоке "Блог"
    chronicle = 5   # Количество событий в блоке "Стрічка новин 